<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ZT Digital PPOB — Isi Pulsa & Bayar Tagihan</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap');

:root{
  --bg:#0a0e1a; --surface:#121a2c; --surface-2:#1b2540; --surface-3:#242f52;
  --cyan:#2dd4bf; --blue:#3b82f6; --text:#eef2f8; --muted:#7c88a6;
  --ok:#34d399; --line:#ffffff12; --radius:16px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
h1,h2,h3{font-family:'Manrope',sans-serif;margin:0;}
button,input{font-family:'Inter',sans-serif;}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:78px;position:relative;}

/* ---------- Header ---------- */
header{padding:22px 18px 16px;display:flex;align-items:center;gap:12px;}
.logo{width:40px;height:40px;border-radius:12px;overflow:hidden;flex:none;background:var(--surface-2);}
.logo img{width:100%;height:100%;object-fit:cover;}
header .brand{flex:1;min-width:0;}
header .brand p.greet{margin:0;font-size:12px;color:var(--muted);}
header .brand h1{font-size:16.5px;margin-top:2px;}
.btn-refresh{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:var(--cyan);cursor:pointer;flex:none;}
.btn-refresh.spin svg{animation:spin .6s linear;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ---------- Kartu ringkasan ---------- */
.ringkasan-card{margin:0 18px 16px;background:linear-gradient(135deg,var(--surface-2),var(--surface-3));border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:flex;justify-content:space-between;}
.ringkasan-card .kolom span{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;}
.ringkasan-card .kolom b{font-family:'Manrope',sans-serif;font-size:17px;color:var(--cyan);}
.ringkasan-card .kolom.kanan{text-align:right;}

/* ---------- Menu cepat ---------- */
.quick-row{display:flex;justify-content:space-between;padding:0 18px 18px;gap:6px;}
.quick{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;cursor:pointer;color:var(--text);}
.quick .bulat{width:46px;height:46px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:19px;}
.quick.aktif .bulat{background:linear-gradient(135deg,var(--blue),var(--cyan));border-color:transparent;}
.quick span{font-size:11px;color:var(--muted);font-weight:600;}

/* ---------- Banner promo ---------- */
.banner{margin:0 18px 20px;border-radius:var(--radius);padding:20px;background:linear-gradient(120deg,var(--blue),var(--cyan));position:relative;overflow:hidden;color:#04121a;}
.banner h3{font-size:15.5px;font-weight:800;}
.banner p{margin:4px 0 0;font-size:12.5px;opacity:.85;max-width:75%;}
.banner .ikon-besar{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:42px;opacity:.35;}

/* ---------- Search & chips ---------- */
.search{margin:0 18px 14px;position:relative;}
.search input{width:100%;padding:13px 16px 13px 42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:14px;}
.search input::placeholder{color:var(--muted);}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);}
.search input:focus{outline:2px solid var(--cyan);outline-offset:1px;}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 18px 16px;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{flex:none;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;}
.chip.aktif{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#04121a;border-color:transparent;}

/* ---------- Produk list ---------- */
.produk-list{padding:0 18px;display:flex;flex-direction:column;gap:10px;}
.produk{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;cursor:pointer;position:relative;}
.produk:active{background:var(--surface-2);}
.produk .avatar{width:40px;height:40px;border-radius:11px;background:var(--surface-3);color:var(--cyan);display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:800;font-size:14px;flex:none;}
.produk .info{flex:1;min-width:0;}
.produk .info h3{font-size:14.5px;font-weight:600;}
.produk .info span{display:block;font-size:12px;color:var(--muted);margin-top:2px;}
.produk .harga{font-family:'Manrope',sans-serif;font-weight:800;font-size:14px;color:var(--cyan);white-space:nowrap;}
.produk.habis{opacity:.35;pointer-events:none;}
.fav-btn{background:none;border:none;font-size:16px;cursor:pointer;padding:0 2px;flex:none;color:var(--muted);}
.fav-btn.aktif{color:#f4c430;}
.kosong{text-align:center;color:var(--muted);padding:40px 20px;font-size:13.5px;}

/* ---------- Bottom sheet order ---------- */
.overlay{position:fixed;inset:0;background:#000a;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;}
.overlay.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:-100%;max-width:480px;margin:0 auto;background:var(--surface);border-radius:20px 20px 0 0;padding:20px 20px 24px;transition:bottom .25s ease;z-index:21;max-height:88vh;overflow-y:auto;}
.sheet.show{bottom:0;}
.sheet-handle{width:36px;height:4px;background:var(--line);border-radius:99px;margin:0 auto 16px;}
.sheet h2{font-size:16px;margin-bottom:2px;}
.sheet .sheet-harga{color:var(--cyan);font-family:'Manrope',sans-serif;font-weight:800;font-size:15px;margin-bottom:16px;}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:600;}
input.field{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font-size:14px;margin-bottom:5px;}
input.field:focus{outline:2px solid var(--cyan);}
.hint{font-size:11.5px;color:var(--cyan);min-height:16px;margin-bottom:12px;}
.total-box{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border-radius:12px;padding:13px 15px;margin:14px 0;}
.total-box span{font-size:13px;color:var(--muted);}
.total-box b{font-family:'Manrope',sans-serif;font-size:17px;color:var(--text);}
.btn-kirim{width:100%;padding:15px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#04121a;font-family:'Manrope',sans-serif;font-weight:800;font-size:14.5px;cursor:pointer;}
.err{color:#f87171;font-size:12px;margin-bottom:10px;display:none;}

/* ---------- Riwayat ---------- */
.riwayat-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 18px 10px;}
.riwayat-item .top{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600;}
.riwayat-item .meta{font-size:12px;color:var(--muted);margin-top:4px;}
.status{font-size:11px;background:#34d39922;color:var(--ok);padding:3px 9px;border-radius:99px;font-weight:600;}

/* ---------- Akun ---------- */
.akun-card{margin:0 18px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center;}
.akun-card .logo-big{width:64px;height:64px;border-radius:16px;margin:0 auto 12px;overflow:hidden;}
.akun-card .logo-big img{width:100%;height:100%;object-fit:cover;}
.akun-card h2{font-size:16px;}
.akun-card p{color:var(--muted);font-size:13px;margin-top:4px;}
.btn-wa{display:inline-block;margin-top:16px;padding:12px 22px;border-radius:99px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#04121a;font-weight:700;font-size:13.5px;text-decoration:none;}
.info-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px;margin:0 18px;}
.info-row:last-child{border-bottom:none;}
.info-row span:first-child{color:var(--muted);}
.hide{display:none !important;}

/* ---------- Bottom nav ---------- */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:15;}
nav.tabbar button{flex:1;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:6px 0;cursor:pointer;}
nav.tabbar button.aktif{color:var(--cyan);}
</style>
</head>
